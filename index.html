<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Planner</title>
<style>
:root{--bg:#f5f5f2;--fg:#16181b;--line:#dde0e3;--muted:#5b616a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1113;--fg:#eceef0;--line:#2a2e33;--muted:#9aa2ab;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:none;font:inherit;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:7px 16px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--bg);background:var(--fg)}
nav button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<nav role="tablist" aria-label="Destinations">
  <button role="tab" data-t="nyc">🗽 New York</button>
  <button role="tab" data-t="japan">🗾 Japan</button>
</nav>
<iframe id="f" title="Trip plan"></iframe>
<script>
const T={nyc:"nyc.html",japan:"japan.html"};
const f=document.getElementById("f"),btns=[...document.querySelectorAll("nav button")];
function show(t){
  if(!T[t]) t="nyc";
  if(f.getAttribute("src")!==T[t]) f.src=T[t];
  btns.forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  if(location.hash!=="#"+t) history.replaceState(null,"","#"+t);
}
btns.forEach(b=>b.onclick=()=>show(b.dataset.t));
addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
